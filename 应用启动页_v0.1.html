<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>App launch · Prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#141516;color:#f3f1ed;font:14px -apple-system,BlinkMacSystemFont,sans-serif}main{display:flex;justify-content:center;align-items:flex-start;gap:40px;padding:32px 20px}.phone{width:390px;max-width:100%;height:844px;border:1px solid #414246;border-radius:30px;overflow:hidden;background:#202123;position:relative;flex-shrink:0}.status{position:absolute;inset:0 0 auto;display:flex;justify-content:space-between;padding:17px 24px;font-size:14px;font-weight:600}.status svg{width:66px;height:16px}.mark{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:88px;height:88px;display:grid;place-items:center}.mark svg{width:72px;height:72px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}.home-indicator{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:132px;height:5px;border-radius:5px;background:#f3f1ed}aside{width:300px;padding-top:12px;line-height:1.7}h1{font-size:22px;margin:0 0 14px}p{color:#aaa9a5;margin:0 0 20px}label{display:block;margin-bottom:8px}select,button{font:inherit;color:inherit;background:#303133;border:1px solid #555;border-radius:10px;min-height:44px;padding:10px 14px;width:100%}select{margin-bottom:12px}button{cursor:pointer;margin-bottom:12px}button.primary{background:#f3f1ed;color:#202123;border-color:transparent;font-weight:600}button:focus-visible,select:focus-visible{outline:2px solid #f3f1ed;outline-offset:3px}#review-status{font-size:12px;color:#aaa9a5}.playing .mark{animation:appear .55s ease-out both}@keyframes appear{from{opacity:0;transform:translate(-50%,-50%) scale(.94)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@media(prefers-reduced-motion:reduce){.playing .mark{animation:none}}@media(max-width:760px){main{padding:0;flex-direction:column;align-items:center;gap:0}.phone{height:100dvh;min-height:480px;border:0;border-radius:0}aside{width:min(390px,100%);padding:24px 20px}}
</style>
<main><section class="phone" aria-label="App launch"><div class="status"><span>9:41</span><svg viewBox="0 0 66 16" fill="currentColor" aria-hidden="true"><path d="M0 10h3v5H0zm5-3h3v8H5zm5-3h3v11h-3zm5-3h3v14h-3zM27 5q7-7 14 0l-2 2q-5-5-10 0zm3 4q4-4 8 0l-4 5z"/><rect x="47" y="3" width="16" height="11" rx="3" fill="none" stroke="currentColor"/><rect x="49" y="5" width="12" height="7" rx="1"/><path d="M64 6h2v5h-2z"/></svg></div><div class="mark"><svg viewBox="0 0 24 24" role="img" aria-label="App icon placeholder"><rect x="2" y="5" width="20" height="16" rx="5"/><circle cx="12" cy="13" r="4"/><path d="m7 5 2-3h6l2 3"/></svg></div><div class="home-indicator"></div></section><aside lang="zh-CN"><h1>应用启动页 v0.1</h1><p>打开应用时短暂展示，完成初始化后进入后续流程。当前沿用首页相机图形占位，正式应用图标与产品名待定。</p><label for="launch-mode">启动情境（原型演示）</label><select id="launch-mode"><option value="auto">按当前使用记录</option><option value="first">首次使用 → 新人介绍</option><option value="returning">再次启动 → 首页</option></select><button id="play" class="primary">播放启动流程</button><button id="hold">停留查看</button><div id="review-status" role="status" aria-live="polite"></div><p>不登录、不申请权限。原型用约1.2秒模拟初始化，正式应用准备就绪即进入，不强制延长启动。进入后使用替换跳转，返回不会回到启动页。</p></aside></main>
<script>
const params=new URLSearchParams(location.search),mode=document.querySelector('#launch-mode'),phone=document.querySelector('.phone'),status=document.querySelector('#review-status');let timer;
function destination(value){let seen=false;try{seen=localStorage.getItem('ai-camera-framework-100-v3-intro')==='done'}catch{}const first=value==='first'||(value==='auto'&&!seen);return '1.0.0一级页面框架_v0.4.html?tab=discover'+(first?'&intro=1':'')}
function hold(){clearTimeout(timer);phone.classList.remove('playing');status.textContent='已暂停，便于查看启动画面。'}
function play(){clearTimeout(timer);phone.classList.remove('playing');void phone.offsetWidth;phone.classList.add('playing');status.textContent='正在演示启动…';const dest=destination(mode.value);timer=setTimeout(()=>location.replace(dest),1200)}
mode.onchange=hold;document.querySelector('#play').onclick=play;document.querySelector('#hold').onclick=hold;window.addEventListener('pagehide',()=>clearTimeout(timer));if(params.get('mode')&&['auto','first','returning'].includes(params.get('mode')))mode.value=params.get('mode');if(params.get('preview')==='1')hold();else play();
</script></html>
