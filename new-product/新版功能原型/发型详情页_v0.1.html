</style><link rel="stylesheet" href="生成流程衔接.css"><link rel="stylesheet" href="二级页渐变标题.css?v=gradient-title-72"><main><section class="phone gradient-title-page"><div class="status">9:41</div><header><button id="back" aria-label="Back to Home">‹</button><h1 id="collection-title">Hairstyle</h1><span></span></header><div id="content"></div></section><aside lang="zh-CN"><h2>发型详情</h2><p>首页→发型详情→选款→选片→制作演示。大图横滑／前后对比，全部发型缩略图直接横向展示，无分类Tab。三个款式暂为示意；预览使用现有发型插画，不代表真实AI效果。正式同人物发型对比素材待补。</p></aside></main><script>
const $=s=>document.querySelector(s),params=new URLSearchParams(location.search),content=$('#content');
function savePosition(){}
function back(){location.href='首页功能探索_v0.1.html?tab='+ (new URLSearchParams(location.search).get('entry')==='events'?'events':'discover')+'&type=photo&v=events-banner-list-81'}
const retroAllLooks=[['bob','Soft bob','../workspace/assets/edit-bob.svg'],['waves','Loose waves','../workspace/assets/edit-waves.svg'],['pixie','Pixie cut','../workspace/assets/edit-pixie.svg']];
const filterCategories=[['all','All',null]];
const filterCategory='all';
let retroLooks=retroAllLooks.slice(),retroActive=Math.max(0,retroAllLooks.findIndex(l=>l[0]===params.get('filter'))),retroSplit=50;
function renderRetro(){
 $('#collection-title').textContent='Hairstyle';document.title='Hairstyle · Preview';
 document.querySelector('.phone').classList.add('retro-page');
 content.innerHTML=`<section class="retro-demo"><div class="retro-gallery" id="retro-gallery" aria-label="Hairstyle previews" tabindex="0">${retroLooks.map(([id,name,filter],i)=>`<div class="retro-slide" role="group" aria-label="${name}, ${i+1} of ${retroLooks.length}"><div class="retro-compare" data-compare="${i}"><img src="../workspace/assets/edit-waves.svg" alt="Before: original portrait" draggable="false"><img class="retro-after" src="${filter}" alt="After: ${name} illustrative preview" draggable="false"><span class="retro-divider" aria-hidden="true"></span><span class="retro-label before">Before</span><span class="retro-label after">After</span><input class="retro-slider" type="range" min="0" max="100" value="${retroSplit}" aria-label="${name} before and after comparison"></div></div>`).join('')}</div><div class="retro-navigation"><h2 class="retro-name" id="retro-name" aria-live="polite"></h2></div></section><section class="retro-options" id="filter-options" role="tabpanel" aria-labelledby="filter-category-${filterCategory}"><div class="retro-rail">${retroLooks.map(([id,name,filter],i)=>`<button class="retro-option" data-retro="${i}" aria-label="Select ${name}" aria-pressed="false"><img src="${filter}" alt=""><span>${name}</span></button>`).join('')}</div></section><button class="retro-use" id="retro-use">Use this hairstyle</button>`;
 const gallery=$('#retro-gallery'),slides=[...content.querySelectorAll('.retro-slide')],reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 function select(i,move=true){
  retroActive=Math.max(0,Math.min(retroLooks.length-1,i));
  $('#retro-name').textContent=retroLooks[retroActive][1];
  content.querySelectorAll('[data-retro]').forEach((b,n)=>b.setAttribute('aria-pressed',String(n===retroActive)));

  const rail=content.querySelector('.retro-rail'),thumb=content.querySelector(`[data-retro="${retroActive}"]`);
  rail.scrollTo({left:thumb.offsetLeft-rail.offsetLeft-(rail.clientWidth-thumb.clientWidth)/2,behavior:reduced?'instant':'smooth'});
  const u=new URL(location.href);u.searchParams.set('filter',retroLooks[retroActive][0]);u.searchParams.delete('filterCategory');history.replaceState(null,'',u);
  if(move)gallery.scrollTo({left:slides[retroActive].offsetLeft-slides[0].offsetLeft,behavior:reduced?'instant':'smooth'});
 }
 content.querySelectorAll('[data-retro]').forEach(b=>b.onclick=()=>select(Number(b.dataset.retro)));
 content.querySelectorAll('.retro-slider').forEach(input=>{
  function split(value){retroSplit=Math.max(0,Math.min(100,value));content.querySelectorAll('[data-compare]').forEach(box=>box.style.setProperty('--split',retroSplit+'%'));content.querySelectorAll('.retro-slider').forEach(r=>r.value=retroSplit)}
  let dragging=false;
  input.onpointerdown=e=>{e.preventDefault();e.stopPropagation();dragging=true;input.focus({preventScroll:true});input.setPointerCapture(e.pointerId)};
  input.onpointermove=e=>{if(!dragging)return;e.preventDefault();e.stopPropagation();const rect=input.parentElement.getBoundingClientRect();split((e.clientX-rect.left)/rect.width*100)};
  input.onpointerup=e=>{e.stopPropagation();dragging=false};input.onpointercancel=()=>dragging=false;
  input.onkeydown=e=>e.stopPropagation();input.oninput=e=>split(Number(e.target.value));
 });
 content.querySelectorAll('[data-compare]').forEach(box=>box.style.setProperty('--split',retroSplit+'%'));
 let scrollTimer;gallery.onscroll=()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{if(slides.length<2)return;const stride=slides[1].offsetLeft-slides[0].offsetLeft;select(Math.round(gallery.scrollLeft/stride),false)},120)};
 gallery.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();select(retroActive+(e.key==='ArrowLeft'?-1:1))}};

 select(retroActive,false);gallery.scrollLeft=slides[retroActive].offsetLeft-slides[0].offsetLeft;
 $('#retro-use').onclick=()=>{savePosition();sessionStorage.setItem('camera-creation-origin',JSON.stringify({tab:params.get('entry')==='events'?'events':'discover',type:'photo'}));location.href='制作页面_并排配对_v0.1.html?flow=product&style=hair-'+encodeURIComponent(retroLooks[retroActive][0])+'&entry=create&hairEntry=1&filter='+encodeURIComponent(retroLooks[retroActive][0])+'&sourceTab='+(params.get('entry')==='events'?'events':'discover')+'&permissionEntry=selection'};
}
$('#back').onclick=back;renderRetro();</script></html>
