dth:720px){.stage{display:block;padding:0}.phone{margin:0 auto;border-radius:0}.notes{width:402px;max-width:100%;padding:28px 20px;margin:auto}}@media(max-width:401px){.phone{width:100%;height:100dvh;min-height:650px}.rail{height:calc(100% - 88px)}.style{width:calc(100vw - 40px);height:100%}.content{left:18px;right:18px}h1{font-size:26px}.description{font-size:13px}}

</style><link rel="stylesheet" href="标题层级规范.css?v=20261029"><main class="stage"><section class="phone" aria-label="Video template details"><div class="status"><span>9:41</span><span>▮▮▮　⌁　▰</span></div><div class="rail" tabindex="0" aria-label="Video templates"></div><div class="home"></div><div class="toast" role="status" hidden></div></section><aside class="notes" lang="zh-CN"><h2>视频模板详情</h2><p>从视频模板卡片进入，先看动态效果，再使用模板选片。沿用图片详情的沉浸式布局，仅保留标题、统一短句与创作入口。</p><p>仅在入口主题／分类范围内左右首尾循环切换，仅当前模板静音循环播放；右侧图标切换声音开／关，默认静音。减少动态效果时默认暂停，点击声音按钮后播放。收藏与主页面使用同一记录。</p><div class="controls"><button id="previous" aria-label="Previous template">‹</button><span id="position" aria-live="polite"></span><button id="next" aria-label="Next template">›</button></div><label for="play-state">播放演示状态</label><select id="play-state"><option value="normal">正常</option><option value="error">播放失败</option></select><p>本地视频样片为现有动画转换，非用户生成结果且样片无音轨；音量按钮控制播放器静音状态，实际声音需正式带音轨素材。模板使用单照片演示配置，正式画幅、时长及输入规则待配置确认。</p></aside></main><script src="主题合集配置.js"></script><script src="模板详情浏览.js?v=20261102-scope"></script><script>
const templates=CameraTemplateBrowse.resolve(location.search,'motion-portrait').filter(t=>t.mediaType==='video').map(t=>({...t,poster:t.image}));
const $=s=>document.querySelector(s),rail=$('.rail'),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,key='ai-camera-framework-100-v3-favorites';let current=Math.max(0,templates.findIndex(t=>t.id===new URLSearchParams(location.search).get('style'))),timer,settleTimer;const paused=templates.map(()=>reduced);let soundEnabled=false;
function soundIcon(on){return `<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4Z"/>${on?'<path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/>':'<path d="m16 9 5 6m0-6-5 6"/>'}</svg>`}
function syncSound(){cards.forEach((c,i)=>{const v=c.querySelector("video"),b=c.querySelector(".playback");v.muted=!soundEnabled;b.innerHTML=soundIcon(soundEnabled);b.setAttribute("aria-label",soundEnabled?"Turn sound off":"Turn sound on");b.setAttribute("aria-pressed",String(soundEnabled))})}let favorites=[];function readFavorites(){try{const v=JSON.parse(localStorage.getItem(key)||'[]');favorites=Array.isArray(v)?v:[]}catch{favorites=[]}}readFavorites();
function toast(text){clearTimeout(timer);$('.toast').textContent=text;$('.toast').hidden=false;timer=setTimeout(()=>$('.toast').hidden=true,2200)}
const heart='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg>';
const collectionId=new URLSearchParams(location.search).get('collection');
function returnToList(){if(collectionId){location.href='主题合集页_v0.1.html?collection='+encodeURIComponent(collectionId);return}let dest='1.0.0一级页面框架_v0.4.html?tab=videos&type=video';try{const ctx=JSON.parse(sessionStorage.getItem('camera-video-template-return'));if(['discover','templates','videos'].includes(ctx?.tab))dest='1.0.0一级页面框架_v0.4.html?tab='+ctx.tab+'&type=video&templateReturn=1'+(ctx.category?'&category='+encodeURIComponent(ctx.category):'')}catch{}location.href=dest}
templates.forEach((t,i)=>{const card=document.createElement('article');card.className='style';card.setAttribute('aria-label',t.name+' template');card.innerHTML=`<video class="portrait" muted loop playsinline preload="metadata" poster="${t.poster}" aria-label="${t.name} video preview"><source src="${t.video}" type="video/mp4"></video><div class="shade"></div><div class="card-top"><button class="icon back" aria-label="Back to templates">‹</button><button class="icon favorite" aria-label="Save ${t.name} to favorites" aria-pressed="false">${heart}</button></div><div class="video-feedback" role="status"></div><button class="retry-video" hidden>Try again</button><button class="playback" aria-label="Turn sound on" aria-pressed="false"></button><div class="content"><h1>${t.name}</h1><p class="style-tagline">A new way to see yourself.</p><button class="primary">Use this style</button></div>`;rail.append(card);const v=card.querySelector('video'),play=card.querySelector('.playback'),feedback=card.querySelector('.video-feedback'),retry=card.querySelector('.retry-video');v.muted=true;
function error(){feedback.textContent='Couldn’t play this preview.';retry.hidden=false;play.hidden=true}v.addEventListener('error',error);v.addEventListener('waiting',()=>{if($('#play-state').value!=='error')feedback.textContent='Loading…'});v.addEventListener('playing',()=>feedback.textContent='');
card.querySelector('.back').onclick=returnToList;card.querySelector('.primary').onclick=()=>location.href='照片准备页_v0.3.html?style='+t.id+'&entry=create'+(collectionId?'&collection='+encodeURIComponent(collectionId):'')+'&group='+encodeURIComponent(templates.map(t=>t.id).join(','));card.querySelector('.favorite').onclick=()=>{readFavorites();const exists=favorites.includes(t.id);const next=exists?favorites.filter(id=>id!==t.id):[t.id,...favorites];try{localStorage.setItem(key,JSON.stringify(next));favorites=next;syncFavorites();toast(exists?'Removed from favorites':'Saved to favorites')}catch{toast('Couldn’t save. Try again.')}};
play.onclick=()=>{soundEnabled=!soundEnabled;paused[i]=false;syncPlayback()};retry.onclick=()=>{if($('#play-state').value==='error'){error();return}v.load();paused[i]=false;syncPlayback()};});
let cards=[],activeCard,currentLoop;
function syncFavorites(){cards.forEach(c=>{const i=Number(c.dataset.templateIndex),selected=favorites.includes(templates[i].id),b=c.querySelector('.favorite');b.setAttribute('aria-pressed',String(selected));b.setAttribute('aria-label',(selected?'Remove ':'Save ')+templates[i].name+(selected?' from favorites':' to favorites'))})}
function syncPlayback(){cards.forEach(c=>{const i=Number(c.dataset.templateIndex),v=c.querySelector('video'),b=c.querySelector('.playback'),feedback=c.querySelector('.video-feedback'),retry=c.querySelector('.retry-video');c.inert=c!==activeCard;const active=c===activeCard&&!document.hidden;if(!active){v.pause();return}if($('#play-state').value==='error'){v.pause();feedback.textContent='Couldn’t play this preview.';retry.hidden=false;b.hidden=true;return}retry.hidden=true;b.hidden=false;feedback.textContent='';if(paused[i])v.pause();else v.play().catch(()=>{feedback.textContent='Tap to preview.'})});syncSound();$('#position').textContent=(current+1)+' / '+templates.length;$('#previous').disabled=$('#next').disabled=templates.length<2;const url=new URL(location.href);url.searchParams.set('style',templates[current].id);history.replaceState(null,'',url)}
currentLoop=CameraTemplateBrowse.loop(rail,current,(index,active,all)=>{current=index;activeCard=active;cards=all;syncFavorites();syncPlayback()});
for(const card of cards){const v=card.querySelector('video'),feedback=card.querySelector('.video-feedback'),retry=card.querySelector('.retry-video');v.addEventListener('error',()=>{feedback.textContent='Couldn’t play this preview.';retry.hidden=false;card.querySelector('.playback').hidden=true});v.addEventListener('waiting',()=>{if(card===activeCard&&$('#play-state').value!=='error')feedback.textContent='Loading…'});v.addEventListener('playing',()=>{feedback.textContent='';retry.hidden=true})}
$('#play-state').onchange=syncPlayback;document.addEventListener('visibilitychange',syncPlayback);window.addEventListener('storage',()=>{readFavorites();syncFavorites()});
</script></html>
