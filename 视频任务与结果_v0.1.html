</style><link rel="stylesheet" href="生成星光动效.css?v=20261028-stars5"><link rel="stylesheet" href="标题层级规范.css?v=20261029"><main><section class="phone" aria-label="Video task prototype"><div class="status">9:41</div><header><button id="back" aria-label="Back to My videos">‹</button><h1 id="title">Video</h1><details class="result-more" id="result-more" hidden><summary aria-label="More options">⋯</summary><button data-action="delete">Delete creation</button></details></header><div id="screen"></div><div id="save-toast" class="save-toast" role="status" aria-live="polite" aria-atomic="true"></div></section><aside lang="zh-CN"><h2>视频任务与结果</h2><p>评审用本地模拟，不上传照片、不调用生成或保存分享服务。可播放视频由现有动态样片转换，不代表当前用户的生成结果。主题推荐使用现有示例。</p><label for="state">任务演示状态</label><select id="state"><option value="generating">生成中</option><option value="completed">已完成</option><option value="failed">失败</option><option value="timeout">超时</option></select><label for="play-outcome">播放演示状态</label><select id="play-outcome"><option value="normal">正常播放</option><option value="error">播放失败</option></select><label for="save-outcome">保存／分享演示结果</label><select id="save-outcome"><option value="success">成功</option><option value="permission">权限受限</option><option value="failure">失败</option><option value="cancel">分享取消</option></select><button id="create-demo">新建视频演示任务</button><p>任务状态手动切换，不自动推进，不展示虚构百分比或生成耗时。播放器进度为本地视频真实播放进度。</p><a href="1.0.0一级页面框架_v0.4.html?tab=me&type=video">返回我的视频 ↗</a></aside></main><dialog id="full-result" aria-label="Video player"><button id="close-full-result" aria-label="Close video player">×</button><div class="video-stage"><video id="result-video" controls playsinline preload="metadata" aria-label="Generated video preview"></video><div id="video-feedback" class="video-feedback" role="status" aria-live="polite"></div><button id="video-retry" class="video-retry" hidden>Try playing again</button></div></dialog><dialog id="confirm"><h2>Delete this creation?</h2><p>Saved videos will stay on your device.</p><button class="primary" id="delete-confirm">Delete creation</button><button class="secondary" id="delete-cancel">Keep creation</button></dialog><script src="图片任务共享.js?v=20261029-one-creation"></script><script>
const $=s=>document.querySelector(s),store=CameraPhotoTasks;let id=new URLSearchParams(location.search).get('task'),toastTimer;
function get(){return store.read().find(t=>t.id===id&&(t.mediaType||store.styles[t.styleId].mediaType)==='video')}
function back(){location.href=CameraCreationFlow.taskBackURL(get())}
function toast(text){clearTimeout(toastTimer);$('#save-toast').textContent=text;$('#save-toast').classList.add('visible');toastTimer=setTimeout(()=>{$('#save-toast').classList.remove('visible');$('#save-toast').textContent=''},2200)}
function again(){const t=get();if(t)location.href=CameraCreationFlow.retryURL(t)}
function recommendedThemes(current){const themes=[{title:'A different side of you',ids:['golden-hour','dark-studio','city-film']},{title:'Better together',ids:['duo-portrait']}];return '<div class="recommended-themes">'+themes.map(theme=>{const ids=theme.ids.filter(key=>key!==current);if(!ids.length)return '';return `<section class="recommended-theme"><div class="recommendation-heading"><h2>${theme.title}</h2><button data-action="browse" aria-label="Explore more templates">More <span aria-hidden="true">›</span></button></div><div class="recommendation-rail">${ids.map(key=>{const item=store.styles[key];return `<button class="recommended-template ${theme.ids.length===1?'duo-recommendation':''}" data-recommend="${key}" aria-label="View ${item.name}"><img src="${item.image}" alt="${item.name} template preview"><span>${item.name}</span></button>`}).join('')}</div></section>`}).join('')+'</div>'}

es" aria-hidden="true"><div class="sparkle-cluster">${Array.from({length:5},()=>'<svg viewBox="0 0 32 32"><path d="M16 3C17.5 12.5 19.5 14.5 29 16C19.5 17.5 17.5 19.5 16 29C14.5 19.5 12.5 17.5 3 16C12.5 14.5 14.5 12.5 16 3Z"/></svg>').join('')}</div></div></div><div class="generation-summary-copy"><h2 role="status">A little magic, developing…</h2><button class="track-link" data-action="explore">Find your next look <span aria-hidden="true">↗</span></button></div></section>${recommendedThemes(t.styleId)}`}
const video=$('#result-video');function playbackError(){$('#video-feedback').textContent='Couldn’t play this video.';$('#video-retry').hidden=false}
function openPlayer(){const t=get();if(!t)return;if(!$('#full-result').open)$('#full-result').showModal();$('#video-retry').textContent='Try playing again';$('#video-feedback').textContent='Loading…';$('#video-retry').hidden=true;video.poster=store.styles[t.styleId].image;if($('#play-outcome').value==='error'){video.pause();video.removeAttribute('src');video.load();playbackError();return}video.src=CameraCreationFlow.videoSource(t);video.load();video.play().catch(()=>{if(video.error)playbackError();else $('#video-feedback').textContent='Tap play to start.'})}
video.addEventListener('waiting',()=>$('#video-feedback').textContent='Loading…');video.addEventListener('playing',()=>$('#video-feedback').textContent='');video.addEventListener('pause',()=>{if(!video.ended&&!video.error&&video.currentTime>0)$('#video-feedback').textContent='Paused'});video.addEventListener('ended',()=>{$('#video-feedback').textContent='';$('#video-retry').textContent='Watch again';$('#video-retry').hidden=false});video.addEventListener('error',()=>{if(video.hasAttribute('src'))playbackError()});
$('#video-retry').onclick=()=>{if(video.ended){video.currentTime=0;$('#video-retry').hidden=true;video.play().catch(playbackError)}else openPlayer()};$('#close-full-result').onclick=()=>$('#full-result').close();$('#full-result').addEventListener('close',()=>video.pause());$('#full-result').addEventListener('cancel',()=>video.pause());
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(!e.target.closest('#result-more'))$('#result-more').open=false;if(b.dataset.recommend){location.href='模板详情页_v0.2.html?style='+encodeURIComponent(b.dataset.recommend);return}const a=b.dataset.action;if(a==='back'){back();return}if(a==='browse'){location.href='1.0.0一级页面框架_v0.4.html?tab=templates';return}if(a==='explore'){location.href='1.0.0一级页面框架_v0.4.html?tab=discover';return}if(a==='check'){$('#notice').textContent='No new result yet. Your task is still processing.';return}if(a==='again'){again();return}if(a==='play'){openPlayer();return}if(a==='delete'){$('#result-more').open=false;$('#confirm').showModal()}if(a==='save'||a==='share'){const outcome=$('#save-outcome').value;$('#notice').textContent='';if(outcome==='permission')$('#notice').textContent='Allow photo access in Settings, then try again.';else if(outcome==='failure')$('#notice').textContent='Couldn’t '+(a==='save'?'save':'share')+' this video. Try again.';else if(a==='share'&&outcome==='cancel')return;else toast(a==='save'?'Saved to Photos':'Shared')}});
$('#state').onchange=e=>{if(get()){store.update(id,{status:e.target.value});video.pause();if($('#full-result').open)$('#full-result').close();render()}};$('#play-outcome').onchange=()=>{if($('#full-result').open)openPlayer()};$('#create-demo').onclick=()=>{id=store.create('motion-portrait').id;history.replaceState(null,'','?task='+id);render()};$('#back').onclick=back;$('#delete-cancel').onclick=()=>$('#confirm').close();$('#delete-confirm').onclick=()=>{store.remove(id);$('#confirm').close();back()};window.addEventListener('storage',()=>{if(!get()||get().status!=='completed'){video.pause();if($('#full-result').open)$('#full-result').close()}render()});render();
