<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feedback · Prototype</title><style>
*{box-sizing:border-box}body{margin:0;background:#141516;color:#f3f1ed;font:14px -apple-system,BlinkMacSystemFont,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;min-height:44px;border:0;color:inherit;background:none}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #f3f1ed;outline-offset:3px}[hidden]{display:none!important}main{display:flex;justify-content:center;gap:40px;padding:32px 20px}.phone{width:402px;max-width:100%;height:874px;border:1px solid #414246;border-radius:30px;overflow:hidden;background:#202123;display:flex;flex-direction:column}.status{height:50px;padding:17px 24px;flex:none}header{height:60px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:0 16px;flex:none}header h1{font-size:22px;text-align:center;margin:0;font-weight:600}header button{font-size:28px}#body{overflow:auto;flex:1;padding:16px 20px 24px}label,.section-label{display:block;font-size:16px;font-weight:600;margin:0 0 12px}.optional{font-size:12px;color:#aaa9a5;font-weight:400;margin-left:6px}textarea,input{display:block;width:100%;border:1px solid #48494c;border-radius:12px;background:#292a2c;color:#f3f1ed;padding:14px;font-size:14px;line-height:1.6}textarea{resize:vertical;min-height:180px;max-height:300px}input{min-height:52px}textarea::placeholder,input::placeholder{color:#92928f}.field{margin-bottom:28px}.counter{text-align:right;font-size:11px;color:#aaa9a5;margin:8px 0 0}.photos{display:flex;flex-wrap:wrap;gap:10px}.attachment{position:relative;width:84px;height:84px}.attachment img{display:block;width:100%;height:100%;object-fit:cover;border-radius:9px}.remove{position:absolute;right:-4px;top:-4px;border:1px solid #777;border-radius:50%;background:#202123;min-height:28px;width:28px;font-size:18px}.add-photo{width:84px;height:84px;border:1px dashed #666;border-radius:9px;display:grid;place-items:center}.add-photo svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.5}.hint{font-size:12px;color:#aaa9a5;line-height:1.6;margin:10px 0 0}.error{font-size:13px;line-height:1.6;color:#f0aaa7;margin:0 0 14px}.error:empty{display:none}footer{padding:16px 20px 28px;flex:none}.primary{width:100%;min-height:52px;background:#f3f1ed;color:#202123;border-radius:12px;font-weight:600}.success{text-align:center;display:flex;flex-direction:column;justify-content:center;min-height:100%;padding:24px 10px}.success svg{width:52px;height:52px;margin:0 auto 24px;stroke:#ddd9d0;fill:none;stroke-width:1.5}.success h2{font-size:22px;margin:0 0 12px}.success p{font-size:13px;line-height:1.7;color:#aaa9a5;margin:0}.success .primary{margin-top:32px}aside{width:300px;line-height:1.8}aside h2{font-size:21px}aside p{color:#aaa9a5}aside label{font-size:14px}select{width:100%;min-height:44px;background:#292a2c;color:#eee;border:1px solid #555;border-radius:8px;padding:10px}@media(max-width:760px){main{padding:0;flex-direction:column;align-items:center}.phone{height:100dvh;min-height:560px;border:0;border-radius:0}aside{padding:24px 20px;width:min(402px,100%)}}
</style><link rel="stylesheet" href="生成流程衔接.css"><main><section class="phone" aria-label="Feedback"><div class="status">9:41</div><header><button id="back" aria-label="Back to Me">‹</button><h1>Feedback</h1><span></span></header><div id="body"><form id="form"><section class="field"><label for="message">How can we help?</label><textarea id="message" maxlength="2000" placeholder="Tell us what happened or share an idea." required></textarea><p class="counter"><span id="count">0</span>/2000</p></section><section class="field"><p class="section-label">Screenshots<span class="optional">Optional</span></p><div class="photos" id="photos"></div><p class="hint">Up to 3 images · 10 MB each</p><input id="files" type="file" accept="image/*" multiple hidden></section><section class="field"><label for="email">Email<span class="optional">Optional</span></label><input id="email" type="email" autocomplete="email" placeholder="For a reply from our team"></section><p id="error" class="error" role="status" aria-live="polite"></p></form><section id="success" class="success" hidden><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="20"/><path d="m14 24 7 7 14-15"/></svg><h2>Thanks for sharing.</h2><p>Your feedback has been received.</p><button id="done" class="primary">Back to Me</button></section></div><footer id="footer"><button id="submit" form="form" class="primary" disabled>Send feedback</button></footer></section><aside lang="zh-CN"><h2>Feedback v0.1</h2><p>问题描述必填；截图与回复邮箱选填，不自动附带用户照片或日志。最多3张截图，每张10MB。未提交内容在当前页面会话中保留，返回我的后可继续填写；关闭本演示会话后不保证找回。</p><p>提交为原型模拟，不发送邮件、不上传截图，也未接入客服收件服务。成功文字展示的是正式产品交互方案；可切换失败分支检查输入保留。</p><label for="outcome">提交演示</label><select id="outcome"><option value="success">成功</option><option value="failure">失败</option></select></aside></main><script>
const $=s=>document.querySelector(s),key='camera-feedback-draft-v1';let busy=false,files=[];let sent=false;const feedbackSource=new URLSearchParams(location.search).get('source'),fromPrivacy=feedbackSource==='privacy',fromSettings=feedbackSource==='settings',returnURL=fromPrivacy?'隐私与数据页_v0.1.html':'1.0.0一级页面框架_v0.4.html?tab=me&returnTask=1'+(fromSettings?'&panel=settings':'');if(fromPrivacy||fromSettings){const label=fromPrivacy?'Back to Privacy & data':'Back to Settings';$('#back').setAttribute('aria-label',label);$('#done').textContent=label}
function photoDraft(mode,value){return new Promise((resolve,reject)=>{const req=indexedDB.open('camera-feedback-draft',1);req.onupgradeneeded=()=>req.result.createObjectStore('draft');req.onerror=()=>reject(req.error);req.onsuccess=()=>{const db=req.result,tx=db.transaction('draft',mode==='get'?'readonly':'readwrite'),store=tx.objectStore('draft');let data;const op=mode==='get'?store.get('photos'):mode==='clear'?store.delete('photos'):store.put(value,'photos');op.onsuccess=()=>data=op.result;tx.oncomplete=()=>{db.close();resolve(data)};tx.onerror=()=>{db.close();reject(tx.error)}}})}
async function back(){if(busy)return;save();try{await photoDraft('put',files.map(f=>f.file))}catch{}location.href=returnURL}
function save(){try{sessionStorage.setItem(key,JSON.stringify({message:$('#message').value,email:$('#email').value}))}catch{}}
function update(){$('#count').textContent=$('#message').value.length;$('#submit').disabled=busy||!$('#message').value.trim();save()}
function photos(){$('#photos').innerHTML=files.map((f,i)=>`<div class="attachment"><img src="${f.url}" alt="Screenshot ${i+1}"><button type="button" class="remove" data-remove="${i}" aria-label="Remove screenshot ${i+1}">×</button></div>`).join('')+(files.length<3?'<button type="button" class="add-photo" id="add" aria-label="Add screenshots"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 18 6-6 4 4 4-6 4 5"/></svg></button>':'');$('#add')?.addEventListener('click',()=>$('#files').click())}
$('#files').onchange=e=>{let error='';for(const file of e.target.files){if(!file.type.startsWith('image/')){error='Choose an image file.';continue}if(file.size>10*1024*1024){error='Choose images smaller than 10 MB.';continue}if(files.length>=3){error='You can attach up to 3 images.';break}files.push({file,url:URL.createObjectURL(file)})}$('#error').textContent=error;e.target.value='';photos()};
$('#photos').onclick=e=>{const b=e.target.closest('[data-remove]');if(!b||busy)return;const index=Number(b.dataset.remove);URL.revokeObjectURL(files[index].url);files.splice(index,1);photos()};
$('#form').onsubmit=async e=>{e.preventDefault();if(busy||!$('#message').value.trim()||!$('#email').checkValidity())return;busy=true;$('#error').textContent='';$('#submit').textContent='Sending…';$('#form').inert=true;$('#back').disabled=true;update();await new Promise(r=>setTimeout(r,1000));busy=false;$('#form').inert=false;$('#back').disabled=false;if($('#outcome').value==='failure'){$('#error').textContent='Couldn’t send your feedback. Please try again.';$('#submit').textContent='Try again';update();return}sent=true;sessionStorage.removeItem(key);try{await photoDraft('clear')}catch{}files.forEach(f=>URL.revokeObjectURL(f.url));files=[];$('#form').hidden=true;$('#footer').hidden=true;$('#success').hidden=false;$('#done').focus()};
$('#message').oninput=$('#email').oninput=update;$('#back').onclick=()=>{if($('#success').hidden)back();else location.href=returnURL};$('#done').onclick=()=>location.href=returnURL;try{const saved=JSON.parse(sessionStorage.getItem(key));if(saved){$('#message').value=saved.message||'';$('#email').value=saved.email||''}}catch{}photos();update();photoDraft('get').then(saved=>{if(saved&&!sent&&!files.length){files=saved.map(file=>({file,url:URL.createObjectURL(file)}));photos()}}).catch(()=>{});
</script></html>
