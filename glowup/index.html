function selectRechargePack(index,inDialog=false){
  if(!inDialog)selectedRechargePack=index;
  const root=inDialog?modal:app;
  root.querySelectorAll('.credit-pack').forEach((button,position)=>{
    const selected=position===index;
    button.classList.toggle('pack-selected',selected);
    button.setAttribute('aria-pressed',String(selected));
  });

  submit.textContent=rechargeButtonLabel(rechargePacks[index]);

function toggleTemplateComparison(button){

function animateTemplate(closing){
  const poster=templateDetail.querySelector('.detail-poster');
  if(!poster.animate||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  poster.getAnimations().forEach(animation=>animation.cancel());
  const origin=detailOrigin?.getBoundingClientRect();
  const target=poster.getBoundingClientRect();
  const frames=origin?.width&&origin.height
    ?[
      {left:`${origin.left-target.left}px`,top:`${origin.top-target.top}px`,width:`${origin.width}px`,height:`${origin.height}px`,borderRadius:'12px'},
      {left:'0px',top:'0px',width:`${target.width}px`,height:`${target.height}px`,borderRadius:'0px'}
    ]
    :[{opacity:0},{opacity:1}];
  const options={duration:closing?220:320,easing:'cubic-bezier(.2,.7,.2,1)',direction:closing?'reverse':'normal',fill:closing?'forwards':'backwards'};
  return poster.animate(frames,options);
}

async function closeTemplate(){
  if(templateDetail.classList.contains('detail-closing'))return;
  templateDetail.classList.add('detail-closing');
  const animation=animateTemplate(true);
  if(animation)await animation.finished.catch(()=>{});
  templateDetail.close();
  detailOrigin=null;
  templateDetail.classList.remove('detail-closing');
}

templateDetail.addEventListener('cancel',event=>{
  event.preventDefault();
  closeTemplate();
});

function startTemplate(index,input){

  templateDetail.close();

  files=Array(templates[index].people).fill(null);
  renderMake();

}

    <div class="modal-icon login-profile-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2" stroke-linecap="round"/></svg></div>
    <h2 id="email-sign-in-title">Sign in to GlowUp</h2>
    <p>We’ll send a one-time code to your email.</p>
    <form novalidate onsubmit="event.preventDefault();sendEmailCode()">
      <label class="email-label">Email address
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required autofocus>
      </label>

      <button class="wide" type="submit">Send code</button>
    </form>
    <p class="terms">Demo only. No email will be sent.</p>`;
  modal.oncancel=event=>{event.preventDefault();cancelEmailLogin()};
  if(!modal.open)modal.showModal();

const DEMO_EMAIL_CODE='123456';

function sendEmailCode(){
  const input=document.getElementById('email');
  if(!input.checkValidity()){
    document.getElementById('email-error').textContent='Enter a valid email address.';
    input.focus();
    return;
  }
  modal.setAttribute('aria-labelledby','email-code-title');
  modal.innerHTML=loginNavigation('editEmailForCode()')+`
    <div class="modal-icon" aria-hidden="true">✉</div>
    <h2 id="email-code-title">Enter your code</h2>
    <p>Use the 6-digit code for <strong id="code-recipient" class="email-code-recipient"></strong>.</p>
    <form novalidate onsubmit="event.preventDefault();verifyEmailCode()">
      <label class="email-label">Verification code
        <input id="email-code" type="text" inputmode="numeric" autocomplete="one-time-code"
          maxlength="6" placeholder="123456" aria-describedby="email-code-error email-code-demo" required autofocus>
      </label>
      <p id="email-code-error" role="status"></p>
      <button class="wide" type="submit">Verify code</button>
    </form>
    <p id="email-code-demo" class="terms">Demo code: <strong>${DEMO_EMAIL_CODE}</strong>. No email was sent.</p>`;
  document.getElementById('code-recipient').textContent=input.value;
  document.getElementById('email-code').focus();
}

function editEmailForCode(){
  emailLogin(document.getElementById('code-recipient').textContent);
}

function verifyEmailCode(){
  const input=document.getElementById('email-code');
  const code=input.value.trim();
  if(code!==DEMO_EMAIL_CODE){
    document.getElementById('email-code-error').textContent=/^\d{6}$/.test(code)
      ?'That code doesn’t match. Try again.'
      :'Enter a 6-digit code.';
    input.focus();
    return;
  }
  login();
}
function login(){awaitingLogin=false;modal.oncancel=null;accountSignedIn=true;if(accountLoginMode){accountLoginMode=false;if(accountSnapshot){state.member=accountSnapshot.member;state.credits=accountSnapshot.credits;state.jobs=accountSnapshot.jobs;creditHistory=accountSnapshot.history;accountSnapshot=null}closeModal();update();if(window.afterWorksSignIn){window.afterWorksSignIn=false;works()}else update();return}activateMembership();const resume=window.resumeAfterPurchase;window.resumeAfterPurchase=false;continueAfterMembership(resume);}
function releaseGenerationOverlay(overlay){
  overlay.remove();
  document.body.classList.remove('is-generating');
  app.removeAttribute('inert');
  document.querySelector('main>header').removeAttribute('inert');
}

function generationFailureMessage(job){
  return job.result==='network'
    ?'Could not submit. Your credits have been returned.'
    :'Generation failed. Credits were not returned.';
}

function generate(){
  if(busy)return;
  busy=true;
  const template=templates[current];
  const result=document.getElementById('outcome').value;
  chargeGeneration(template);
  const job={t:template,status:'processing',result,originals:files.slice()};
  state.jobs.unshift(job);
  update();
  document.getElementById('generate').disabled=true;
  document.getElementById('status').textContent='';

  const overlay=document.createElement('div');
  overlay.id='generation-overlay';
  overlay.innerHTML=`<div class="generation-message"><div class="glow-loader" aria-hidden="true"><span class="loader-orbit orbit-one"></span><span class="loader-orbit orbit-two"></span><span class="loader-core"><svg viewBox="0 0 42 42" fill="none"><path d="M29 12a13 13 0 1 0 4 16H22" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="m32 2 2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="currentColor"/></svg></span><i class="loader-spark spark-one">✧</i><i class="loader-spark spark-two">✦</i></div><p role="status">Creating your glow</p><span class="loading-subtitle">A little magic is on its way</span><div class="loading-progress"><span></span></div>
    ${accountSignedIn?'<button type="button" class="generation-gallery">View my creations</button>':''}
  </div>`;
  document.body.appendChild(overlay);
  document.body.classList.add('is-generating');
  app.setAttribute('inert','');
  document.querySelector('main>header').setAttribute('inert','');
  overlay.querySelector('.generation-gallery')?.addEventListener('click',()=>{
    releaseGenerationOverlay(overlay);
    works();
  });

  setTimeout(()=>{
    job.status=result==='ok'?'done':'failed';
    const index=state.jobs.indexOf(job);
    if(result==='network'){
      const owner=index>=0?state:accountSnapshot;
      if(owner?.jobs.includes(job)){
        changeCredits(template.cost,'Submission refund · '+template.name,'refund','',owner);
      }
    }
    busy=false;
    update();

    if(!overlay.isConnected){
      const card=app.querySelector(`.works-grid [data-job-index="${index}"]`);
      if(card)card.outerHTML=workCard(job,index);
      return;
    }

    releaseGenerationOverlay(overlay);
    if(job.status==='done'){
      view(index);
    }else{
      document.getElementById('generate').disabled=false;
      document.getElementById('status').textContent=generationFailureMessage(job)+' You can try again.';
    }
  },4200);
}
let accountSignedIn=false,accountLoginMode=false,accountSnapshot=null;
function closeAccount(){document.getElementById('account-panel').hidden=true;document.getElementById('account-shade').hidden=true;document.querySelector('.creations-entry').setAttribute('aria-expanded','false')}
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeAccount()});
const SUPPORT_EMAIL='support@example.com';
const DEVICE_ID_KEY='glowup.deviceId';
let contactDeviceId;

function contactMailto(){
  if(!contactDeviceId){
    try{contactDeviceId=localStorage.getItem(DEVICE_ID_KEY)}catch{}
    if(!contactDeviceId){
      const bytes=crypto.getRandomValues(new Uint8Array(16));
      contactDeviceId=Array.from(bytes,byte=>byte.toString(16).padStart(2,'0')).join('');
      try{localStorage.setItem(DEVICE_ID_KEY,contactDeviceId)}catch{}
    }
  }
  const subject=encodeURIComponent('GlowUp support');
  const body=encodeURIComponent('Device ID: '+contactDeviceId);
  return `mailto:${SUPPORT_EMAIL}?subject=${subject}&body=${body}`;
}

function account(){const panel=document.getElementById('account-panel');if(!panel.hidden){closeAccount();return}const top=document.querySelector('header').getBoundingClientRect().bottom;document.documentElement.style.setProperty('--account-top',Math.max(0,top)+'px');panel.innerHTML=`<section class="profile-identity"><div class="profile-avatar">${accountSignedIn?'M':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></svg>'}</div><div class="profile-details"><h2>${accountSignedIn?'GlowUp creator':'Welcome to GlowUp'}</h2>${accountSignedIn?'<p>creator@example.com</p>':'<button class="profile-signin" onclick="closeAccount();startAccountLogin()">Sign in to your account ›</button>'}</div></section>${accountSignedIn?`<div class="profile-menu"><a class="profile-contact" href="${contactMailto()}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Contact us</span></a><button class="profile-signout" onclick="signOut()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H4v16h6M9 12h12m-5-5 5 5-5 5"/></svg><span>Sign out</span></button></div>`:''}`;panel.hidden=false;document.getElementById('account-shade').hidden=false;document.querySelector('.creations-entry').setAttribute('aria-expanded','true');update()}
function signOut(){

  state.member=false;

function works(){document.querySelector('main').scrollTop=0;activeNav('works');update();returnView=null;app.innerHTML=''+(!state.jobs.length?'<div class="empty-gallery"><div class="empty-images"><img src="'+photo(templates[1])+'" alt="Portrait inspiration"><img src="'+photo(templates[3])+'" alt="Portrait inspiration"></div><h2>Your story starts here.</h2><p>Your photos and videos will find<br>a home in this little gallery.</p><button onclick="browse()">Find your first look</button></div>':'<div class="works-grid">'+state.jobs.map(workCard).join('')+'</div>');update();setupTemplatePreviews();window.scrollTo(0,0)}

function reviewCreation(status,showFailure=false){
  const overlay=document.getElementById('generation-overlay');
  if(overlay)releaseGenerationOverlay(overlay);
  const existing=state.jobs.findIndex(job=>job.reviewSample);
  if(existing>=0)state.jobs.splice(existing,1);
  const template=templates.find(item=>item.type==='image'&&item.people===1);
  state.jobs.unshift({
    t:template,
    status,
    result:status==='failed'?'failed':'ok',
    originals:[comparisonBeforePhoto(template)],
    reviewSample:true
  });
  if(showFailure)viewFailedCreation(0);
  else works();
}

function workCard(job,index){
  const cover=`<img src="${photo(job.t)}" alt="" loading="lazy">`;
  const badge=job.t.type==='video'?'<span class="work-card-video">▶ Video</span>':'';
  const processing=job.status==='processing';
  const failed=job.status==='failed';
  const overlay=processing
    ?'<span class="work-state-overlay work-loading-overlay"><span class="work-spinner" aria-hidden="true"></span><span class="work-card-status">Generating…</span></span>'
    :failed?'<span class="work-state-overlay"><span class="work-card-status">Failed</span></span>':'';
  const footer=`<span class="work-card-footer"><span class="work-card-title">${job.t.name}</span></span>`;
  const content=cover+overlay+badge+footer;
  if(processing)return `<div class="work-card is-processing" data-job-index="${index}" role="status">${content}</div>`;
  const action=failed?`viewFailedCreation(${index})`:`view(${index},true)`;
  return `<button type="button" class="work-card ${failed?'is-failed':''}" data-job-index="${index}" onclick="${action}">${content}</button>`;
}

function viewFailedCreation(index){
  const job=state.jobs[index];
  document.querySelector('main').scrollTop=0;
  app.innerHTML=`<section class="result-page failed-creation">
    <div class="result-top"><button class="back" type="button" onclick="works()" aria-label="Back to my creations">‹</button><span>${job.t.name}</span><span></span></div>
    <div class="failed-creation-content">
      <div class="failed-creation-icon" aria-hidden="true">!</div>
      <h2>Generation failed</h2>

      <img class="failed-template-preview" src="${photo(job.t)}" alt="${job.t.name} template preview">
    </div>
    <div class="result-actions failed-creation-actions"><button class="wide" type="button" onclick="retryCreation(${index})">Try again</button></div>
  </section>`;
  update();
  window.scrollTo(0,0);
}

function retryCreation(index){
  const job=state.jobs[index];
  current=templates.indexOf(job.t);
  files=Array.from({length:job.t.people},(_,slot)=>job.originals?.[slot]||null);
  renderMake();
}
let previewObserver=null,previewCleanups=[];
function setupTemplatePreviews(){if(previewObserver)previewObserver.disconnect();previewCleanups.forEach(fn=>fn());previewCleanups=[];if(!('IntersectionObserver' in window))return;previewObserver=new IntersectionObserver(entries=>{entries.forEach(entry=>{const video=entry.target;
  if(video.classList.contains('template-comparison')){
    video.classList.toggle('comparison-in-view',entry.isIntersecting);
    return;
  }
  if(entry.isIntersecting&&!document.hidden){if(!video._startPreview)attachPhotoPreview(video);if(video._startPreview)video._startPreview()}else if(video._stopPreview)video._stopPreview()})},{threshold:.3});document.querySelectorAll('#app .template-comparison, #app .template-preview').forEach(preview=>previewObserver.observe(preview))}
function attachPhotoPreview(video){const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');if(!canvas.captureStream||!ctx)return;canvas.width=240;canvas.height=320;const image=new Image();let frame=0,running=false,stream=null;const draw=time=>{if(!running)return;if(image.complete&&image.naturalWidth){const z=1.04+.035*Math.sin(time/1800),scale=Math.max(240/image.width,320/image.height)*z,w=image.width*scale,h=image.height*scale;ctx.drawImage(image,(240-w)/2,(320-h)/2,w,h)}frame=requestAnimationFrame(draw)};video._startPreview=()=>{if(running)return;running=true;if(!stream){stream=canvas.captureStream(15);video.srcObject=stream}video.play().catch(()=>{});frame=requestAnimationFrame(draw)};video._stopPreview=()=>{running=false;cancelAnimationFrame(frame);video.pause()};image.src=video.dataset.preview;previewCleanups.push(()=>{video._stopPreview();if(stream)stream.getTracks().forEach(track=>track.stop());video.srcObject=null})}
document.addEventListener('visibilitychange',()=>{if(document.hidden){document.querySelectorAll('.template-preview').forEach(v=>v._stopPreview&&v._stopPreview())}else if(document.querySelector('.template-preview'))setupTemplatePreviews()});
let resultIndex=0,resultOriginal=false,resultFromWorks=false;
function view(i,fromWorks=false){resultFromWorks=fromWorks;resultIndex=i;resultOriginal=false;renderResult();window.scrollTo(0,0)}
function backFromResult(){if(resultFromWorks){works();return}const job=state.jobs[resultIndex];current=templates.indexOf(job.t);files=(job.originals||[]).slice();renderMake()}
function toggleResult(){resultOriginal=!resultOriginal;renderResult()}
function renderResult(){const j=state.jobs[resultIndex];const originals=j.originals||[];app.innerHTML=`<section class="result-page"><div class="result-top"><button class="back" onclick="backFromResult()" aria-label="Back">‹</button><span>${j.t.name}</span><span></span></div><div class="result-stage ${resultOriginal?'original-view':''}">${resultOriginal?`<div class="original-images ${originals.length>1?'pair':''}">${originals.length?originals.map((src,k)=>`<div><img src="${src}" alt="Original photo ${k+1}">${originals.length>1?'<span>Person '+(k+1)+'</span>':''}</div>`).join(''):'<p>Original photo unavailable.</p>'}</div>`:`<div class="result-generated ${j.t.type==='video'?'moving':''}"><img src="${photo(j.t)}" alt="Generated result demo"></div>`}${resultOriginal?'<span class="result-mode-label">Original</span>':''}<button class="compare-toggle ${resultOriginal?'is-original':''}" onclick="toggleResult()" aria-label="${resultOriginal?'Show generated result':'Show original photos'}" aria-pressed="${resultOriginal}" title="Switch original / generated"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h5M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5M12 2v20"/></svg></button></div><div class="result-actions"><button class="result-new" onclick="browse()">Create more</button><button class="result-download" onclick="download(resultIndex)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12m-5-5 5 5 5-5M4 18v3h16v-3" stroke-linecap="round" stroke-linejoin="round"/></svg>Download</button></div></section>`;update()}
async function download(i){const j=state.jobs[i],video=j.t.type==='video';let blob;try{if(video){const image=await fetch(photo(j.t)).then(r=>r.blob());const data=await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(image)});blob=new Blob(['<!doctype html><meta charset="utf-8"><title>GlowUp demo preview</title><style>body{background:#121217;color:white;text-align:center;font:16px system-ui}img{width:min(80vw,400px);animation:move 3s infinite alternate}@keyframes move{to{transform:scale(1.04)}}</style><p>Animated photo reference — not a generated video.</p><img src="'+data+'">'],{type:'text/html'})}else{blob=await fetch(photo(j.t)).then(r=>r.blob())}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='glowup-demo.'+(video?'html':'jpg');a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){alert('Please open through a local web server to download. Photo previews still work when opened as a local file.')}}
