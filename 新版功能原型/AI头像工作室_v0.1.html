r;justify-content:space-between;margin:10px 0}.style-meta strong{font-weight:500;font-size:18px}.text{color:var(--accent);font-size:13px}.photo-pick{width:100%;border:1px dashed #68616e;border-radius:16px;display:flex;align-items:center;gap:14px;text-align:left;padding:16px;margin:18px 0}.photo-pick img{width:58px;height:58px;border-radius:10px;object-fit:cover}.photo-pick b{font-weight:500;font-size:14px}.photo-pick small{display:block;color:var(--muted);font-size:12px;margin-top:5px}.plus{font-size:26px;display:grid;place-items:center;width:58px;height:58px;background:#323037;border-radius:10px}.foot{flex:none;padding:14px 20px 30px;background:var(--bg);border-top:1px solid var(--line)}.primary{width:100%;height:52px;border-radius:28px;background:linear-gradient(110deg,#cbb4e9,#e3b4cf);color:#28232c;font-size:15px;font-weight:600}.home{position:absolute;bottom:8px;width:132px;height:5px;background:var(--fg);left:calc(50% - 66px);border-radius:5px;pointer-events:none}.crop{width:100%;aspect-ratio:1;background:#121213;position:relative;overflow:hidden;touch-action:none;cursor:grab;user-select:none}.crop canvas{width:100%;height:100%;display:block}.crop.circle:after{content:'';position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 100px #202123df;border:1px solid #f3f1ed99;pointer-events:none}.mode{display:flex;gap:6px;border-radius:24px;background:#303134;padding:4px;margin:20px auto;width:220px}.mode button{flex:1;border-radius:20px;font-size:13px;min-height:36px;color:var(--muted)}.mode button[aria-pressed=true]{background:#53515a;color:var(--fg)}.zoom{display:flex;align-items:center;gap:16px;margin:22px 0}.zoom input{flex:1;accent-color:var(--accent);min-width:0}.zoom button{font-size:24px;width:32px}.hint{text-align:center;font-size:12px}.preview-pair{display:flex;justify-content:center;gap:30px;margin:26px 0}.preview-pair canvas{width:106px;height:106px;border:1px solid var(--line)}.preview-pair .round{border-radius:50%}.preview-pair small{display:block;text-align:center;font-size:12px;color:var(--muted);margin-top:10px}.success-icon{font-size:36px;color:var(--accent);margin-top:36px}.waiting{text-align:center;padding-top:90px}.waiting img{width:210px;height:210px;object-fit:cover;border-radius:50%}.waiting h2{font-size:25px;margin-top:30px}.spinner{width:26px;height:26px;border:2px solid #56575a;border-top-color:var(--accent);border-radius:50%;margin:30px auto;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:absolute;bottom:110px;left:20px;right:20px;border-radius:12px;padding:14px;background:var(--fg);color:var(--bg);text-align:center;font-size:13px;z-index:10}.toast:empty{display:none}.review{width:300px;font-size:14px;line-height:1.7;color:var(--muted)}.review h2{font-size:22px;letter-spacing:0;color:var(--fg)}.review h3{font-size:15px;color:var(--fg);margin-top:24px}.review button,.review a{display:block;border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:13px;margin:10px 0;color:var(--fg);text-decoration:none;text-align:center}.review button{width:100%}.review p{font-size:13px}.review label{display:block;margin:12px 0}dialog{border:1px solid var(--line);border-radius:22px;background:var(--bg);color:var(--fg);padding:26px;width:min(340px,90vw)}dialog::backdrop{background:#000b}dialog h2{font-size:22px;letter-spacing:0}dialog button{width:100%;border-radius:25px}dialog .primary{margin-top:10px}@media(max-width:760px){.stage{padding:0;display:block}.phone{width:min(100%,402px);height:100dvh;min-height:650px;border:0;border-radius:0;margin:auto}.review{width:min(100%,402px);padding:24px;margin:auto}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}

</style></head><body><div class="stage"><section class="phone"><div class="status"><span>9:41</span><span aria-label="Full signal and battery">▮▮▮ &nbsp; ◒ ▰</span></div><header><button id="back" aria-label="Back">‹</button><h1 id="title">AI Avatar</h1><button id="close" aria-label="Return home">×</button></header><main id="content"></main><footer class="foot"><button class="primary" id="next">Choose this look</button></footer><div class="home"></div><div class="toast" id="toast" role="status"></div></section><aside class="review" lang="zh-CN"><h2>AI 头像 · 功能探索</h2><p>首页金刚位 → 圆形头像列表 → 头像详情 → 复用现有单张选片、编辑、生成和结果流程。</p><h3>本轮展示</h3><p>详情支持方形／圆形预览及左右循环切换。点击 Create avatar 进入原有照片准备页，后续交互与既有流程保持一致。</p><h3>预览工具</h3><button id="demo-list">回到头像列表</button><a href="首页功能探索_v0.1.html?tab=discover">新版首页</a><a href="首页功能探索_v0.1.html?tab=me">我的任务</a></aside></div><input id="file" type="file" accept="image/*" hidden><dialog id="leave"><h2>Leave this creation?</h2><p id="leave-copy">Your current edits will be lost.</p><button class="primary" id="confirm-leave">Leave</button><button id="stay">Keep editing</button></dialog><script src="图片任务共享.js"></script><script>
const $=s=>document.querySelector(s),asset='../assets/portraits-v3/';
const styles=[{id:'dark-studio',name:'Dark Studio',copy:'Quiet confidence',image:asset+'studio-portrait.jpg'},{id:'golden-hour',name:'Golden Hour',copy:'Warm & natural',image:asset+'warm-portrait.jpg'},{id:'city-film',name:'City Film',copy:'Everyday editorial',image:asset+'city-portrait.jpg'}];
let selected=0,step='styles',photo='',photoObject='',task=null,timer,failNext=false,zoom=1,offset={x:0,y:0},mode='circle',img=null,loadToken=0,leaveAction=null,dirty=false,listTop=0,detailMode='square';
function toast(text){$('#toast').textContent=text;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').textContent='',3000)}
function style(){return styles[selected]}
const detailImages={'dark-studio':asset+'dark-studio-still.jpg','golden-hour':asset+'golden-hour-still.jpg','city-film':asset+'city-film-still.jpg'};
const descriptions={'dark-studio':'A studio portrait with expressive light and a quiet, confident feel.','golden-hour':'Soft sunlight and warm tones for a natural, easygoing profile.','city-film':'A cinematic portrait with an everyday editorial feel.'};
function showDetail(index){if(step==='styles')listTop=$('#content').scrollTop;selected=(index+styles.length)%styles.length;detailMode='square';step='detail';render()}
function showStyles(){step='styles';render();$('#content').scrollTop=listTop}

function render(){const s=style();$('#title').textContent=step==='edit'?'Make it yours':step==='done'?'Your new profile':'AI Avatar';$('#next').disabled=false;$('.foot').hidden=false;
if(step==='styles'){$('#content').innerHTML=`<div class="style-grid">${styles.map((s,i)=>`<button class="style" data-style="${i}" aria-pressed="${i===selected}"><img src="${s.image}" alt="${s.name} style preview"><strong>${s.name}</strong><small>${s.copy}</small></button>`).join('')}</div>`;$('.foot').hidden=true}
if(step==='detail'){$('#content').innerHTML=`<div class="mode" aria-label="Detail preview shape"><button data-detailmode="square" aria-pressed="${detailMode==='square'}">Square</button><button data-detailmode="circle" aria-pressed="${detailMode==='circle'}">Circle preview</button></div><img class="detail-picture ${detailMode==='circle'?'circle':''}" src="${detailImages[s.id]}" alt="${s.name} detail preview" draggable="false"><div class="detail-heading"><h2>${s.name}</h2><div class="detail-arrows"><button data-direction="-1" aria-label="Previous avatar style">‹</button><button data-direction="1" aria-label="Next avatar style">›</button></div></div><p class="detail-description">${descriptions[s.id]}</p><span class="detail-count">${selected+1} / ${styles.length}</span>`;$('#next').textContent='Create avatar';setupDetailSwipe()}
if(step==='photo'){$('#content').innerHTML=`<h2>Your photo, your muse.</h2><div class="style-chosen"><img src="${s.image}" alt="Selected style"><span>${s.name}<small>Avatar style</small></span><button class="text" data-action="detail">View style</button></div><button class="photo-stage" data-action="photo" aria-label="${photo?'Change photo':'Add your photo'}">${photo?`<img src="${photo}" alt="Selected photo">`:'<span class="empty-photo"><strong>＋ Add your photo</strong><small>Choose one photo from your library</small></span>'}</button><p class="hint">One person · A clear view of your face</p>`;$('#next').textContent='Generate avatar';$('#next').disabled=!photo}

if(step==='waiting'){$('#content').innerHTML=`<div class="waiting"><img src="${s.image}" alt="Selected style reference"><div class="spinner"></div><h2>Your next look is developing.</h2><p>You can keep exploring while we work.</p></div>`;$('#next').textContent='Explore more'}
if(step==='failed'){$('#content').innerHTML='<div class="waiting"><h2>Could not create your avatar.</h2><p>Your photo and selected style are ready. Try again.</p><button class="text" data-action="photo">Change photo</button></div>';$('#next').textContent='Try again'}
if(step==='edit'){$('#content').innerHTML=`<div class="mode" aria-label="Preview shape"><button data-mode="square" aria-pressed="${mode==='square'}">Square</button><button data-mode="circle" aria-pressed="${mode==='circle'}">Circle</button></div><div class="crop ${mode}" id="crop"><canvas id="canvas" width="1024" height="1024" role="img" aria-label="Avatar crop preview"></canvas></div><p class="hint">Drag to frame your face · Pinch to zoom</p><div class="zoom"><button id="minus" aria-label="Zoom out">−</button><input type="range" id="zoom" min="1" max="3" step="0.01" value="${zoom}" aria-label="Zoom"><button id="plus" aria-label="Zoom in">＋</button></div><button class="text" id="reset">Reset framing</button>`;$('#next').textContent='Preview avatar';setupCrop();loadImage()}
if(step==='done'){$('#content').innerHTML='<div class="success-icon">✧</div><h2>This looks like you.</h2><p>See how your avatar fits, wherever you use it.</p><div class="preview-pair"><div><canvas id="square-preview" width="1024" height="1024" aria-label="Square avatar"></canvas><small>Square</small></div><div><canvas id="circle-preview" class="round" width="1024" height="1024" aria-label="Circular avatar preview"></canvas><small>Circle preview</small></div></div><p class="hint">Saved as a square image, ready for your profile.</p><button class="text" data-action="edit">Adjust framing</button>';$('#next').textContent='Save avatar';loadImage()}
$('#content').scrollTop=0}
function setupDetailSwipe(){let start;const image=$('.detail-picture');image.style.touchAction='pan-y';image.onpointerdown=e=>{start={x:e.clientX,y:e.clientY};image.setPointerCapture(e.pointerId)};image.onpointerup=e=>{if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.4)showDetail(selected+(dx<0?1:-1));start=null};image.onpointercancel=()=>{start=null}}
function loadImage(){const token=++loadToken;img=null;$('#next').disabled=true;const image=new Image();image.onload=()=>{if(token!==loadToken)return;img=image;draw();$('#next').disabled=false};image.onerror=()=>{if(token!==loadToken)return;toast('Preview unavailable. Try another style.');$('#next').disabled=true};image.src=style().image}
function geometry(){const size=1024,scale=Math.max(size/img.width,size/img.height)*zoom;const w=img.width*scale,h=img.height*scale;offset.x=Math.min((w-size)/2,Math.max(-(w-size)/2,offset.x));offset.y=Math.min((h-size)/2,Math.max(-(h-size)/2,offset.y));return {w,h,x:(size-w)/2+offset.x,y:(size-h)/2+offset.y}}
function drawCanvas(c){if(!img||!c)return;const {w,h,x,y}=geometry(),ctx=c.getContext('2d');ctx.clearRect(0,0,1024,1024);ctx.drawImage(img,x,y,w,h)}
function draw(){drawCanvas($('#canvas'));drawCanvas($('#square-preview'));drawCanvas($('#circle-preview'))}
function setZoom(z){zoom=Math.min(3,Math.max(1,z));dirty=true;if($('#zoom'))$('#zoom').value=zoom;draw()}
function setupCrop(){const crop=$('#crop'),points=new Map();let gesture;
function start(){const a=[...points.values()];gesture={start:a[0],offset:{...offset},zoom,distance:a.length>1?Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y):0}}
crop.onpointerdown=e=>{crop.setPointerCapture(e.pointerId);points.set(e.pointerId,{x:e.clientX,y:e.clientY});start()};crop.onpointermove=e=>{if(!points.has(e.pointerId))return;points.set(e.pointerId,{x:e.clientX,y:e.clientY});const a=[...points.values()];if(a.length>1){const distance=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(gesture.distance)setZoom(gesture.zoom*distance/gesture.distance)}else{const scale=1024/crop.clientWidth;offset.x=gesture.offset.x+(e.clientX-gesture.start.x)*scale;offset.y=gesture.offset.y+(e.clientY-gesture.start.y)*scale;dirty=true;draw()}};function end(e){points.delete(e.pointerId);start()}crop.onpointerup=end;crop.onpointercancel=end;crop.onlostpointercapture=end;
$('#zoom').oninput=e=>setZoom(+e.target.value);$('#minus').onclick=()=>setZoom(zoom-.1);$('#plus').onclick=()=>setZoom(zoom+.1);$('#reset').onclick=()=>{zoom=1;offset={x:0,y:0};$('#zoom').value=1;dirty=true;draw()}}
function generate(){try{if(!task||task.status!=='failed'){task=CameraPhotoTasks.create(style().id);CameraPhotoTasks.update(task.id,{avatarStudio:true})}else{task=CameraPhotoTasks.create(style().id,task.id);CameraPhotoTasks.update(task.id,{avatarStudio:true})}CameraPhotoTasks.update(task.id,{status:'generating',previewFinishAt:Date.now()+1800,previewOutcome:failNext?'failed':'completed'});step='waiting';render();const id=task.id;timer=setTimeout(()=>{task=CameraPhotoTasks.update(id,{status:failNext?'failed':'completed'});failNext=false;step=task.status==='failed'?'failed':'edit';zoom=1;offset={x:0,y:0};render()},1800)}catch{toast('Could not save this task. Check browser storage and try again.')}}
$('#next').onclick=()=>{if(step==='detail'){location.href='照片准备页_v0.3.html?style='+encodeURIComponent(style().id)+'&entry=create&avatarEntry=1&permissionEntry=selection&group='+encodeURIComponent(styles.map(s=>s.id).join(','));return}else if(step==='photo'||step==='failed')generate();else if(step==='waiting')goHome();else if(step==='edit'){step='done';render()}else if(step==='done'){const c=$('#square-preview');try{c.toBlob(blob=>{if(!blob){toast('Could not save. Try again.');return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='museme-avatar.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);dirty=false;toast('Download started')},'image/png')}catch{toast('Could not save. Please try again.')}}};
function goHome(){location.href='首页功能探索_v0.1.html?tab=discover'}
function requestLeave(action){if(step==='waiting'||step==='styles'||(!photo&&!dirty&&step!=='edit')){action();return}leaveAction=action;$('#leave').showModal()}
$('#close').onclick=()=>requestLeave(goHome);$('#back').onclick=()=>{if(step==='styles')goHome();else if(step==='detail'){showStyles()}else if(step==='photo'){step='detail';render()}else if(step==='done'){step='edit';render()}else if(step==='failed'){step='photo';render()}else if(step==='waiting')goHome();else requestLeave(()=>{step='photo';dirty=false;render()})};$('#stay').onclick=()=>$('#leave').close();$('#confirm-leave').onclick=()=>{$('#leave').close();leaveAction?.()};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.style!==undefined){showDetail(+b.dataset.style)}if(b.dataset.action==='styles')showStyles();if(b.dataset.action==='detail'){step='detail';render()}if(b.dataset.direction)showDetail(selected+Number(b.dataset.direction));if(b.dataset.detailmode){detailMode=b.dataset.detailmode;$('.detail-picture').classList.toggle('circle',detailMode==='circle');document.querySelectorAll('[data-detailmode]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.detailmode===detailMode))}if(b.dataset.action==='photo')$('#file').click();if(b.dataset.action==='edit'){step='edit';render()}if(b.dataset.mode){mode=b.dataset.mode;$('#crop').classList.toggle('circle',mode==='circle');document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.mode===mode))}});
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){toast('Choose an image file.');e.target.value='';return}const url=URL.createObjectURL(f),check=new Image();check.onload=()=>{if(photoObject)URL.revokeObjectURL(photoObject);photoObject=url;photo=url;step='photo';render();e.target.value=''};check.onerror=()=>{URL.revokeObjectURL(url);toast('Could not open this photo. Try a JPG or PNG.');e.target.value=''};check.src=url};
$('#demo-list').onclick=()=>{if(step==='waiting'){toast('Wait for this task to finish.');return}showStyles()};
const unusedPhotoDemo=$('#demo-photo');if(unusedPhotoDemo)unusedPhotoDemo.onclick=()=>{if(step==='waiting'){toast('Wait for this task to finish.');return}photo=asset+'selfie-portrait.jpg';step='photo';render()};const unusedResultDemo=$('#demo-result');if(unusedResultDemo)unusedResultDemo.onclick=()=>{clearTimeout(timer);if(task&&step==='waiting')CameraPhotoTasks.update(task.id,{status:'completed'});step='edit';zoom=1;offset={x:0,y:0};render()};const unusedFailDemo=$('#demo-fail');if(unusedFailDemo)unusedFailDemo.onclick=()=>{if(step==='waiting'){toast('Wait for this task to finish.');return}photo=photo||asset+'selfie-portrait.jpg';failNext=true;generate()};
const taskId=new URLSearchParams(location.search).get('task');if(taskId){task=CameraPhotoTasks.read().find(x=>x.id===taskId&&x.avatarStudio);if(task){if(task.status==='completed')CameraTaskNotices.markViewed(task.id);selected=Math.max(0,styles.findIndex(x=>x.id===task.styleId));step=task.status==='completed'?'edit':task.status==='failed'?'failed':'waiting';if(step==='waiting'){timer=setTimeout(()=>{task=CameraPhotoTasks.update(task.id,{status:task.previewOutcome==='failed'?'failed':'completed'});step=task.status==='failed'?'failed':'edit';render()},Math.max(0,(task.previewFinishAt||task.createdAt+1800)-Date.now()))}}}if(new URLSearchParams(location.search).get('detail')==='1'){selected=Math.max(0,styles.findIndex(x=>x.id===new URLSearchParams(location.search).get('style')));step='detail'}render();
window.addEventListener('pagehide',()=>{if(photoObject)URL.revokeObjectURL(photoObject)});
</script></body></html>
