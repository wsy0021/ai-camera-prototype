const key=new URLSearchParams(location.search).get('feature'),c=config[key]||config.headshots;document.body.classList.toggle('headshots',key!=='transform');document.title='museme · '+c.name;document.querySelector('#name').textContent=c.name;document.querySelector('#heading').textContent=c.title;document.querySelector('#copy').textContent=c.copy;document.querySelector('#note-title').textContent=c.zh;document.querySelector('#cards').innerHTML=c.items.map(([img,title,copy])=>!img?`<div class="cover placeholder" role="img" aria-label="${title}, image placeholder"><i aria-hidden="true"></i><span>${title}</span></div>`:`<button class="cover" data-image="${img}" aria-label="Preview ${title}"><img src="../assets/creation-tools/${img}" alt="${title} reference"><span>${title}</span><small>${copy}</small></button>`).join('');if(key!=='transform')document.querySelector('#layout-note').textContent='职业照采用单列4:3横向活动卡，整张图片铺满、名称叠在左下角。当前有一张职业照参考素材，其余两卡为空素材占位，不代表已有三个可生成模板。暂不添加分类和使用量；点击已有图片可放大。';let previous;

 const gallery=document.querySelector('.gallery');

 function choose(i,smooth=true){active=(i+looks.length)%looks.length;const card=gallery.children[active];gallery.scrollTo({left:card.offsetLeft-gallery.children[0].offsetLeft,behavior:smooth&&!matchMedia('(prefers-reduced-motion: reduce)').matches?'smooth':'instant'});update()}

 gallery.onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();choose(active+(e.key==='ArrowRight'?1:-1))}};
 let timer;gallery.addEventListener('scroll',()=>{clearTimeout(timer);timer=setTimeout(()=>{active=Array.from(gallery.children).reduce((best,card,i)=>Math.abs(card.offsetLeft-gallery.children[0].offsetLeft-gallery.scrollLeft)<Math.abs(gallery.children[best].offsetLeft-gallery.children[0].offsetLeft-gallery.scrollLeft)?i:best,0);update()},120)});
