</style><link rel="stylesheet" href="生成星光动效.css?v=20261028-stars5"><link rel="stylesheet" href="标题层级规范.css?v=20261029"><main><section class="phone" aria-label="Photo task prototype"><div class="status">9:41</div><header><button id="back" aria-label="Back to My photos">‹</button><h1 id="title">Photo task</h1></header><div id="screen"></div><div id="save-toast" class="save-toast" role="status" aria-live="polite" aria-atomic="true"></div></section><aside lang="zh-CN"><h2>图片任务与结果</h2><p>评审用模拟。示意图片不是用户生成结果；不上传照片、不调用生成、不请求系统通知。任务仅存当前浏览器，不能保证卸载或跨设备恢复。</p><label for="state">当前任务演示状态</label><select id="state"><option value="generating">生成中</option><option value="completed">已完成</option><option value="failed">生成失败</option><option value="timeout">处理超时</option></select><label for="count">结果页展示结构</label><select id="count"><option value="1">单张结果</option><option value="3">多张结果（同图结构示意）</option></select><label for="save-outcome">保存／分享演示结果</label><select id="save-outcome"><option value="success">成功提示</option><option value="permission">相册权限受限</option><option value="failure">失败</option><option value="cancel">分享取消</option></select><button id="create-demo">新建演示任务</button><p>推荐主题与素材为现有样例组合，不代表个性化推荐或真实合拍效果。状态由这里手动切换；不虚构百分比或预计时长。多张结构仅演示浏览，交付张数按模板决定。</p><a href="1.0.0一级页面框架_v0.4.html?tab=me">打开“我的”任务列表 ↗</a></aside></main><dialog id="full-result" aria-label="Portrait preview"><button id="close-full-result" aria-label="Close portrait preview">×</button><img id="full-result-image" alt="Portrait result"></dialog><script src="图片任务共享.js?v=20261029-one-creation"></script><script>
const $=s=>document.querySelector(s),store=CameraPhotoTasks;let id=new URLSearchParams(location.search).get('task'),selected=0;const statusNames={queued:'A little magic, developing…',generating:'A little magic, developing…',completed:'Your portrait is ready',failed:'Generation failed',timeout:'This is taking longer than expected'};
let saveToastTimer;function showSaveToast(){clearTimeout(saveToastTimer);const toast=$('#save-toast');toast.textContent='Saved to Photos';toast.classList.add('visible');saveToastTimer=setTimeout(()=>{toast.classList.remove('visible');toast.textContent=''},2200)}

function render(){const t=get();if(t?.status==='completed'){location.replace('生成成功页_v0.1.html?task='+encodeURIComponent(t.id)+'&entry=history');return}if(!t){$('#screen').classList.remove('waiting-screen');$('#screen').innerHTML='<h2>Task not found.</h2><p>This task may have been removed or is not available in this browser.</p><button class="primary" data-action="back">Back to my photos</button>';$('#state').disabled=true;return}$('#state').disabled=false;$('#state').value=t.status==='queued'?'generating':t.status;const style=store.styles[t.styleId],ready=t.status==='completed',issue=['failed','timeout'].includes(t.status);if(ready)CameraTaskNotices.markViewed(t.id);$('#title').textContent=ready?style.name:'Photo task';const count=Number($('#count').value);selected=Math.min(selected,count-1);
$('#screen').classList.toggle('waiting-screen',!issue);
if(!ready&&!issue){$('#title').textContent=style.name;$('#screen').innerHTML=`<section class="generation-summary" aria-label="Current generation"><div class="waiting-visual"><img src="${style.image}" alt="Template reference, not your result"><div class="generation-sparkles" aria-hidden="true"><div class="sparkle-cluster"><svg viewBox="0 0 32 32"><path d="M16 3C17.5 12.5 19.5 14.5 29 16C19.5 17.5 17.5 19.5 16 29C14.5 19.5 12.5 17.5 3 16C12.5 14.5 14.5 12.5 16 3Z"/></svg><svg viewBox="0 0 32 32"><path d="M16 3C17.5 12.5 19.5 14.5 29 16C19.5 17.5 17.5 19.5 16 29C14.5 19.5 12.5 17.5 3 16C12.5 14.5 14.5 12.5 16 3Z"/></svg><svg viewBox="0 0 32 32"><path d="M16 3C17.5 12.5 19.5 14.5 29 16C19.5 17.5 17.5 19.5 16 29C14.5 19.5 12.5 17.5 3 16C12.5 14.5 14.5 12.5 16 3Z"/></svg><svg viewBox="0 0 32 32"><path d="M16 3C17.5 12.5 19.5 14.5 29 16C19.5 17.5 17.5 19.5 16 29C14.5 19.5 12.5 17.5 3 16C12.5 14.5 14.5 12.5 16 3Z"/></svg><svg viewBox="0 0 32 32"><path d="M16 3C17.5 12.5 19.5 14.5 29 16C19.5 17.5 17.5 19.5 16 29C14.5 19.5 12.5 17.5 3 16C12.5 14.5 14.5 12.5 16 3Z"/></svg></div></div></div><div class="generation-summary-copy"><h2 role="status">A little magic, developing…</h2><button class="track-link" data-action="explore" aria-label="Find your next look — Discover"><span>Find your next look</span><span class="track-chevron" aria-hidden="true">↗</span></button></div></section>${recommendedThemes(t.styleId)}`;return}
$('#screen').innerHTML=ready?`<div class="result-module"><section class="generation-summary result-summary" aria-label="Completed portrait"><button class="result-thumbnail" data-action="zoom" aria-label="View portrait full size"><img src="${style.image}" alt="Portrait result preview"><span class="result-zoom-hint" aria-hidden="true"><svg viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="4.5"/><path d="m12 12 4 4M6.5 8.5h4M8.5 6.5v4"/></svg></span></button><div class="generation-summary-copy"><h2>Your portrait is ready.</h2><div class="result-actions"><button class="primary" data-action="save">Save photo</button><button class="secondary" data-action="share">Share</button></div></div></section><button class="result-explore" data-action="explore">Find your next look <span aria-hidden="true">↗</span></button></div>${count>1?`<div class="thumbs" aria-label="Result photos">${Array.from({length:count},(_,i)=>`<button data-photo="${i}" aria-label="View photo ${i+1}" aria-pressed="${i===selected}"><img src="${style.image}" alt="Sample photo ${i+1}"></button>`).join('')}</div>`:''}<div id="notice" role="status"></div>${recommendedThemes(t.styleId)}`:
`<div class="visual"><img class="preview reference" src="${style.image}" alt="Template reference, not your result"><span>Style reference</span></div><h2 role="status">${statusNames[t.status]}</h2><p>${issue?(t.status==='timeout'?'Your task is still processing.':'Adjust your photo and try again.'):'You can leave this page. Find this task again in My photos.'}</p><p class="meta">${style.name} · ${new Date(t.createdAt).toLocaleString('en-US')}<br>Task ${t.id.slice(0,8)}</p><div id="notice" role="status"></div>${t.status==='timeout'?'<button class="primary" data-action="check">Check status</button>':t.status==='failed'?'<button class="primary" data-action="retry">Choose photos again</button>':''}<button class="${issue?'secondary':'primary'}" data-action="back">Back to my photos</button>`}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.photo!==undefined){selected=Number(b.dataset.photo);render();return}if(b.dataset.recommend){location.href='模板详情页_v0.2.html?style='+encodeURIComponent(b.dataset.recommend);return}const a=b.dataset.action,t=get();if(a==='browse'){location.href='1.0.0一级页面框架_v0.4.html?tab=templates';return}if(a==='explore'){location.href='1.0.0一级页面框架_v0.4.html?tab=discover';return}if(a==='back'){back();return}if(!t)return;if(a==='zoom'){$('#full-result-image').src=store.styles[t.styleId].image;$('#full-result').showModal();return}if(a==='again'||a==='retry'){location.href=CameraCreationFlow.retryURL(t);return}if(a==='check')$('#notice').textContent='No new result yet. Your task is still processing.';if(a==='save'||a==='share'){const outcome=$('#save-outcome').value;if(a==='save'&&['success','cancel'].includes(outcome)){$('#notice').textContent='';showSaveToast();return}$('#notice').textContent=outcome==='permission'?'Photo access is restricted. Allow photo access in system settings, then try again.':outcome==='failure'?'Could not '+(a==='save'?'save':'share')+' this photo. Try again.':outcome==='cancel'&&a==='share'?'Sharing canceled. Your creation is still here.':(a==='save'?'Save successful':'Share successful')+' — interaction preview only; no file or post was created.'}});
