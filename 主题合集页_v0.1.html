<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collection · Prototype</title><style>
*{box-sizing:border-box}body{margin:0;background:#141516;color:#f3f1ed;font:14px -apple-system,BlinkMacSystemFont,sans-serif}button{font:inherit;cursor:pointer;color:inherit;border:0;background:none;min-height:44px}button:focus-visible,select:focus-visible{outline:2px solid #f3f1ed;outline-offset:3px}[hidden]{display:none!important}main{display:flex;justify-content:center;gap:40px;padding:32px 20px}.phone{width:390px;max-width:100%;height:844px;border:1px solid #414246;border-radius:30px;overflow:hidden;background:#202123;display:flex;flex-direction:column}.status{height:50px;padding:17px 24px;flex:none}header{height:60px;flex:none;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:0 16px;border-bottom:1px solid #ffffff0a}header button{font-size:28px}header h1{font-size:17px;font-weight:600;text-align:center;margin:0}#content{flex:1;overflow:auto;scrollbar-width:none;padding:16px 20px 32px;overscroll-behavior:contain}.intro{margin-bottom:24px}.intro h2{font-size:26px;line-height:1.18;letter-spacing:-.7px;margin:0 0 10px;font-weight:600}.intro p{font-size:13px;line-height:1.6;color:#aaa9a5;margin:0;max-width:290px}.collection-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}.tile{min-width:0}.tile button{display:block;width:100%;padding:0;text-align:left;position:relative;border-radius:8px;overflow:hidden;aspect-ratio:3/4;background:#2d2e30}.tile img{display:block;width:100%;height:100%;object-fit:cover}.tile .name{position:absolute;bottom:0;left:0;right:0;padding:32px 10px 12px;background:linear-gradient(transparent,#000b);font-size:13px;line-height:1.4;font-weight:500}.tile.featured{grid-column:1/-1}.tile.featured button{aspect-ratio:4/3}.tile.featured .name{font-size:18px;padding:42px 14px 14px}.tile .description{margin:10px 0 0;color:#aaa9a5;font-size:12px;line-height:1.6}.tile.print img{object-fit:contain}.tile.avatar button{border-radius:50%;aspect-ratio:1}.tile.avatar .name{display:none}.tile.avatar h3{font-size:13px;font-weight:500;text-align:center;margin:10px 0 0}.tile.video button{aspect-ratio:9/16}.video-mark{position:absolute;right:10px;top:10px;background:#20212380;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:14px}.empty{padding:80px 8px;text-align:center}.empty h2{font-size:18px;margin:0 0 12px}.empty p{color:#aaa9a5;line-height:1.6}.empty button{margin-top:16px;border:1px solid #555;border-radius:10px;padding:0 24px}aside{width:300px;line-height:1.8}aside h2{font-size:21px}aside p{color:#aaa9a5}select{background:#2d2e30;color:#eee;min-height:44px;padding:10px;border:1px solid #555;border-radius:8px;width:100%;font:inherit}dialog{width:min(90vw,360px);padding:20px;border:1px solid #555;border-radius:16px;background:#202123;color:#eee}dialog::backdrop{background:#000a}dialog img{width:100%;max-height:45vh;object-fit:contain}dialog h2{font-size:18px;margin:16px 0 8px}dialog p{font-size:13px;line-height:1.6;color:#aaa9a5}dialog button{display:block;margin-left:auto;width:44px;font-size:26px}@media(max-width:760px){main{padding:0;flex-direction:column;align-items:center}.phone{height:100dvh;min-height:560px;border:0;border-radius:0}aside{padding:24px 20px;width:min(390px,100%)}}@media(prefers-reduced-motion:no-preference){.tile button:active{transform:scale(.985)}}
</style><link rel="stylesheet" href="生成流程衔接.css"><main><section class="phone" aria-label="Theme collection"><div class="status">9:41</div><header><button id="back" aria-label="Back to browsing">‹</button><h1 id="collection-title">Collection</h1><span></span></header><div id="content"></div></section><aside lang="zh-CN"><h2>主题合集页 v0.1</h2><p>承接首页活动、主题标题和See all。顶栏直接展示主题标题，内容区直接浏览模板，不再重复标题与简介。标题放预览左下，圆形卡标题在外。</p><p>已有照片／视频模板可进入详情和制作；尚无制作配置的展位模板仅展示效果预览，不借用其他模板生成。返回恢复原浏览页，详情返回合集保留位置。</p><label for="state">合集状态</label><select id="state"><option value="normal">正常</option><option value="empty">暂无模板</option><option value="error">加载失败</option></select></aside></main><dialog id="preview"><button id="close" aria-label="Close preview">×</button><img id="preview-image" alt="Template layout preview"><h2 id="preview-title"></h2><p>Template preview. Creation will be available soon.</p></dialog><script src="图片任务共享.js?v=20261029-one-creation"></script><script src="主题合集配置.js"></script><script>
const $=s=>document.querySelector(s),params=new URLSearchParams(location.search),key=params.get('collection')||'weekend-edit',config=CameraCollections[key],content=$('#content');
const extra={ 'soft-light':{name:'Soft Light',image:'assets/portraits-v3/soft-portrait.jpg'},'demo-photo-strip':{name:'The photo strip',image:'assets/portraits-v3/photo-strip.jpg',print:true},'demo-instant':{name:'Instant memories',image:'assets/portraits-v3/instant.jpg',print:true},'demo-studio-print':{name:'Studio keepsake',image:'assets/portraits-v3/studio-print.jpg',print:true},'demo-profile':{name:'Soft profile',image:'assets/portraits-v3/avatar-portrait.jpg',avatar:true}};
function savePosition(){sessionStorage.setItem('camera-collection-position-'+key,String(content.scrollTop))}
function back(){let origin;try{origin=JSON.parse(sessionStorage.getItem('camera-collection-origin-'+key))}catch{}location.href=CameraCreationFlow.browseURL(origin||{mediaType:'photo'})}
function render(){if(!config){content.innerHTML='<section class="empty"><h2>Collection not available</h2><button id="browse">Back to browsing</button></section>';$('#browse').onclick=back;return}document.title=config.title+' · Collection';$('#collection-title').textContent=config.title;const state=$('#state').value;content.innerHTML=(state==='normal'?`<div class="collection-grid">${config.items.map((id,i)=>{const item=extra[id]||CameraPhotoTasks.styles[id],video=item.mediaType==='video',featured=(i===2||(config.items.length%2===0&&i===config.items.length-1))&&!video&&!item.avatar;return `<article class="tile ${video?'video':''} ${item.print?'print':''} ${item.avatar?'avatar':''} ${featured?'featured':''}"><button data-template="${id}" aria-label="View ${item.name}"><img src="${item.image}" alt="${item.name} preview" ${i>1?'loading="lazy"':''}><span class="name">${item.name}</span>${video?'<span class="video-mark" aria-hidden="true">▷</span>':''}</button>${item.avatar?`<h3>${item.name}</h3>`:''}${featured?'<p class="description">A new perspective, in a style that feels like you.</p>':''}</article>`}).join('')}</div>`:`<section class="empty"><h2>${state==='error'?'Couldn’t load this collection.':'More looks are on their way.'}</h2><p>${state==='error'?'Please try again.':'Explore other themes while you wait.'}</p><button id="empty-action">${state==='error'?'Try again':'Back to browsing'}</button></section>`);$('#empty-action')?.addEventListener('click',()=>{if(state==='error'){$('#state').value='normal';render()}else back()})}
content.addEventListener('click',e=>{const b=e.target.closest('[data-template]');if(!b)return;const id=b.dataset.template;savePosition();if(!CameraPhotoTasks.styles[id]){const t=extra[id];$('#preview-image').src=t.image;$('#preview-title').textContent=t.name;$('#preview').showModal();return}let origin;try{origin=JSON.parse(sessionStorage.getItem('camera-collection-origin-'+key))}catch{}if(origin?.browseOrigin)sessionStorage.setItem('camera-creation-origin',JSON.stringify(origin.browseOrigin));else sessionStorage.removeItem('camera-creation-origin');const page=CameraPhotoTasks.styles[id].mediaType==='video'?'视频模板详情页_v0.1.html':id==='duo-portrait'?'照片准备页_v0.3.html':'模板详情页_v0.2.html';location.href=page+'?style='+encodeURIComponent(id)+'&collection='+encodeURIComponent(key)+(id==='duo-portrait'?'&entry=create':'')});
$('#back').onclick=back;$('#close').onclick=()=>$('#preview').close();$('#state').onchange=()=>{render();content.scrollTop=0};window.addEventListener('pagehide',savePosition);render();content.scrollTop=Number(sessionStorage.getItem('camera-collection-position-'+key))||0;
</script></html>
